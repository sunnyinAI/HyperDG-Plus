experiment_name: batch4_seed2_erm_vlcs_split3
seed: 2
output_dir: experiments/batch4/seed2/erm/vlcs_split3
device: cuda
eval_on_start: false
dataset:
  config: configs/datasets/vlcs.yaml
  data_dir: data
  test_envs:
  - 3
algorithm: hyperdg
hparams:
  lr: 5.0e-05
  curvature_lr: 0.0
  weight_decay: 0.0
  grad_clip_norm: 5.0
  nonlinear_classifier: false
  checkpoint_freq: 200
  alpha_curv: 0.0
  beta_align: 0.0
  gamma_sharp: 0.0
  delta_local_flat: 0.0
  delta_global_flat: 0.0
  curvature_epsilon: 0.0001
  n_steps: 5000
  batch_size: 32
  single_curvature: false
