device: cuda
eval_on_start: false
dataset:
  config: configs/datasets/vlcs.yaml
  data_dir: data
  test_envs:
  - 0
algorithm: hyperdg
hparams:
  lr: 5.0e-05
  curvature_lr: 0.0001
